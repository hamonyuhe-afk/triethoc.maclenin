<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12213a">
  <title>Triết học - Mác và LêNin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101a2b; --panel: #1a2940; --text: #f5f7fb;
      --muted: #b7c4d6; --accent: #f4c95d; --good: #69d6a5; --bad: #ff8290;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 28px 16px; color: var(--text);
      background: radial-gradient(ellipse at 10% 0%, #233d60 0, transparent 38%),
        radial-gradient(ellipse at 100% 100%, #293458 0, transparent 34%), var(--bg);
      font: 16px/1.55 system-ui, "Segoe UI", sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button, select, label { font: inherit; touch-action: manipulation; }
    body.menu-open { overflow: hidden; }
    .game { width: min(850px, 100%); margin: 0 auto; }
    .topline, .stats, .actions, .question-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topline { color: var(--accent); font-weight: 750; letter-spacing: .08em; }
    h1 { margin: 8px 0 4px; font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.15; }
    .intro { margin: 0 0 22px; color: var(--muted); }
    .lesson-switch { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .lesson-switch button { color: var(--text); background: #ffffff12; border: 1px solid #ffffff25; }
    .lesson-switch button.active { color: #192338; background: var(--accent); border-color: var(--accent); }
    .stats { margin: 18px 0 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px;
      border: 1px solid #ffffff20; border-radius: 999px; background: #ffffff0b; font-weight: 700;
    }
    .progress { height: 9px; overflow: hidden; border-radius: 99px; background: #ffffff20; }
    .progress > div { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
    .topline { display: flex; align-items: center; justify-content: space-between; }
    .menu-toggle {
      display: grid;
      gap: 5px;
      width: 44px;
      height: 40px;
      padding: 9px;
      border: 1px solid #ffffff35;
      border-radius: 10px;
      background: #ffffff12;
    }
    .menu-toggle span { display: block; height: 2px; border-radius: 2px; background: var(--accent); }
    .menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 19;
      border: 0;
      border-radius: 0;
      background: #050a12b8;
    }
    .question-nav {
      position: fixed;
      z-index: 20;
      inset: 0 0 0 auto;
      display: flex;
      flex-direction: column;
      width: min(460px, 92vw);
      padding: 20px;
      border-left: 1px solid #ffffff25;
      background: var(--panel);
      box-shadow: -18px 0 50px #0006;
    }
    .question-nav[hidden], .menu-backdrop[hidden] { display: none; }
    .nav-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .nav-header h2 { margin: 0; color: var(--accent); font-size: 1.15rem; }
    .nav-close { padding: 7px 12px; color: var(--text); background: #ffffff18; }
    .question-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      margin-top: 16px;
      padding-right: 4px;
    }
    .question-nav .question-link {
      display: block;
      width: 100%;
      padding: 11px 6px;
      border: 1px solid #ffffff20;
      border-radius: 10px;
      color: var(--text);
      background: #ffffff09;
      text-align: center;
      font-weight: 700;
    }
    .question-nav .question-link:hover { background: #ffffff18; }
    .question-nav .question-link.current { border-color: var(--accent); color: var(--accent); background: #f4c95d20; }
    .question-nav .question-link.done { border-color: #69d6a580; color: var(--good); }
    .question-nav .question-link.current.done { color: var(--accent); }
    .card {
      margin-top: 20px; padding: clamp(18px, 4vw, 30px); border: 1px solid #ffffff20;
      border-radius: 20px; background: linear-gradient(145deg, #1d2c44f5, #17253af5);
      box-shadow: 0 18px 50px #0005;
    }
    .question-head { justify-content: flex-start; margin-bottom: 12px; }
    .number { color: var(--accent); font-weight: 800; }
    .kind { color: var(--muted); font-size: .88rem; }
    #prompt { margin: 0 0 18px; font-size: clamp(1.15rem, 3vw, 1.45rem); line-height: 1.4; }
    #hint { color: var(--muted); font-size: .92rem; }
    .options { display: grid; gap: 10px; }
    .option {
      display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px;
      border: 1px solid #ffffff24; border-radius: 12px; background: #ffffff08;
      cursor: pointer; transition: border-color .15s, background .15s, transform .15s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .option:hover { border-color: #f4c95d88; background: #f4c95d10; transform: translateY(-1px); }
    .option:has(input:checked) { border-color: var(--accent); background: #f4c95d18; }
    .option input { flex: 0 0 auto; margin: 5px 0 0; accent-color: var(--accent); }
    .option.truth-correct, .option.truth-correct:has(input:checked) { border-color: var(--good); background: #69d6a51a; }
    .option.truth-incorrect, .option.truth-incorrect:has(input:checked) { border-color: var(--bad); background: #ff77771a; }
    .option.choice-correct, .option.choice-correct:has(input:checked) { border-color: var(--good); background: #69d6a51a; }
    .option.choice-incorrect, .option.choice-incorrect:has(input:checked) { border-color: var(--bad); background: #ff77771a; }
    .truth-feedback { min-height: 22px; margin: 8px 0 0; font-weight: 700; }
    .truth-feedback.good { color: var(--good); }
    .truth-feedback.bad { color: var(--bad); }
    .drag-bank { display: flex; flex-wrap: wrap; gap: 9px; margin: 16px 0 22px; }
    .drag-chip {
      padding: 9px 13px;
      border: 1px solid #ffffff35;
      border-radius: 999px;
      color: var(--text);
      background: #ffffff10;
      font-weight: 600;
      cursor: grab;
      touch-action: manipulation;
    }
    .drag-chip.selected { border-color: var(--accent); background: #f4c95d25; }
    .drop-target {
      min-height: 76px;
      margin: 12px 0;
      padding: 12px 15px;
      border: 2px dashed #ffffff45;
      border-radius: 12px;
      background: #ffffff08;
    }
    .drop-target.over { border-color: var(--accent); background: #f4c95d15; }
    .drop-label { margin-bottom: 8px; font-weight: 750; }
    .drop-answer { min-height: 32px; color: var(--muted); }
    .drop-answer .drag-chip { cursor: pointer; }
    .match-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; align-items: center; margin: 10px 0; }
    .match-row select {
      width: 100%; min-width: 0; padding: 10px; border: 1px solid #ffffff30;
      border-radius: 9px; color: var(--text); background: #223550;
    }
    .match-row select option { color: #17253a; background: white; }
    #feedback { min-height: 28px; margin: 14px 0 0; font-weight: 700; }
    #feedback.good { color: var(--good); } #feedback.bad { color: var(--bad); }
    .actions { justify-content: flex-end; margin-top: 16px; }
    button {
      padding: 11px 18px; border: 0; border-radius: 10px; color: #192338;
      background: var(--accent); font-weight: 800; cursor: pointer;
    }
    button:hover { filter: brightness(1.07); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary { color: var(--text); background: #ffffff18; }
    button[hidden] { display: none; }
    #summary {
      display: none; margin-top: 20px; padding: 26px; text-align: center;
      border: 1px solid #f4c95d65; border-radius: 20px; background: var(--panel);
    }
    #summary h2 { margin: 0 0 8px; color: var(--accent); }
    .small { color: var(--muted); font-size: .9rem; }
    @media (max-width: 560px) {
      body { padding: 16px 10px; } .stats { flex-wrap: wrap; align-items: flex-start; }
      h1 { font-size: clamp(1.65rem, 8vw, 2.2rem); }
      .lesson-switch { gap: 6px; }
      .lesson-switch button { min-height: 44px; flex: 1 1 82px; padding: 9px 8px; }
      .stats { gap: 6px; }
      .pill { min-height: 38px; }
      .menu-toggle { width: 48px; height: 48px; padding: 12px; }
      .question-nav {
        width: 100%;
        max-width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
      }
      .nav-header { min-height: 48px; }
      .nav-close { min-height: 44px; }
      .question-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        flex: 1;
        max-height: none;
        margin-top: 10px;
        padding-bottom: 10px;
      }
      .question-nav .question-link { min-height: 48px; }
      .card { margin-top: 14px; padding: 16px 12px; }
      #prompt { overflow-wrap: anywhere; }
      .option { min-height: 48px; padding: 12px 10px; }
      .option input { width: 20px; height: 20px; }
      .actions { gap: 8px; }
      .actions button { min-height: 48px; }
      .match-row { grid-template-columns: 1fr; gap: 6px; }
      .actions { justify-content: stretch; } .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="topline">
      <span>🎓 HỌC MÀ CHƠI</span>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Mở danh sách câu hỏi" aria-expanded="false" aria-controls="questionNav">
        <span></span><span></span><span></span>
      </button>
    </div>
    <h1>Chinh phục Triết học</h1>
    <p class="intro" id="lessonIntro">Khám phá triết học và triết học Mác - Lênin. Trả lời câu hỏi để tích lũy điểm và giữ chuỗi chính xác!</p>
    <div class="lesson-switch" aria-label="Chọn bài học">
      <button id="lesson1Button" class="active" type="button" aria-pressed="true">Bài 1</button>
      <button id="lesson2Button" type="button" aria-pressed="false">Bài 2</button>
      <button id="lesson3Button" type="button" aria-pressed="false">Bài 3</button>
      <button id="lesson4Button" type="button" aria-pressed="false">Bài 4</button>
      <button id="lesson5Button" type="button" aria-pressed="false">Bài 5</button>
      <button id="lesson6Button" type="button" aria-pressed="false">Bài 6</button>
      <button id="lesson7Button" type="button" aria-pressed="false">Bài 7</button>
      <button id="lesson8Button" type="button" aria-pressed="false">Bài 8</button>
      <button id="lesson9Button" type="button" aria-pressed="false">Bài 9</button>
    </div>
    <div class="stats">
      <span class="pill">⭐ Điểm: <span id="score">0</span></span>
      <span class="pill">🔥 Chuỗi: <span id="streak">0</span></span>
      <span class="pill">🧩 <span id="count">1/31</span></span>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-label="Tiến độ trò chơi" aria-valuemin="0" aria-valuemax="31" aria-valuenow="0">
      <div id="progressBar"></div>
    </div>
    <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Đóng danh sách câu hỏi" hidden></button>
    <nav id="questionNav" class="question-nav" aria-label="Danh sách câu hỏi" hidden>
      <div class="nav-header">
        <h2>Tất cả câu hỏi · Bài 1</h2>
        <button class="nav-close" id="menuClose" type="button">Đóng</button>
      </div>
      <div class="question-list" id="questionList"></div>
    </nav>
    <section class="card" id="quizCard" aria-live="polite">
      <div class="question-head">
        <span class="number" id="questionNumber"></span>
        <span class="kind" id="questionKind"></span>
      </div>
      <h2 id="prompt"></h2>
      <p id="hint"></p>
      <div class="options" id="options"></div>
      <p id="feedback"></p>
      <div class="actions">
        <button class="secondary" id="checkButton" type="button">Kiểm tra đáp án</button>
        <button id="nextButton" type="button" hidden>Câu tiếp theo →</button>
      </div>
    </section>
    <section id="summary">
      <h2 id="summaryTitle">Hoàn thành chặng!</h2>
      <p id="summaryText"></p>
      <button id="restartButton" type="button">Chơi lại từ đầu</button>
    </section>
  </main>
  <script>
    const lesson1Questions = [
      { text: "Đối tượng nghiên cứu của triết học là gì?", options: [
        "Những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy",
        "Những quy luật vận động của tự nhiên, xã hội",
        "Những quy luật vận động, phát triển của tự nhiên, xã hội và tư duy",
        "Những quy luật hình thành của xã hội và tư duy"
      ], answer: [0] },
      { text: "Chức năng của triết học Mác - Lênin là gì? Chọn 2 đáp án đúng", options: [
        "Chức năng nâng tầm cầu nối cho các khoa học", "Chức năng thế giới quan",
        "Chức năng phương pháp luận", "Chức năng khoa học của các khoa học"
      ], answer: [1, 2], multi: true },
      { text: "Triết học ra đời từ đâu?", options: [
        "Từ sự vận động của ý muốn chủ quan của con người",
        "Từ sự suy tư của con người về bản thân mình",
        "Từ sự sáng tạo của nhà tư tưởng", "Từ thực tiễn, do nhu cầu của thực tiễn"
      ], answer: [3] },
      { text: "Triết học Mác - Lênin là gì? (Chọn 2 đáp án đúng)", options: [
        "Là khoa học nghiên cứu những quy luật chung nhất của tự nhiên",
        "Hệ thống quan điểm duy vật biện chứng về tự nhiên, xã hội và tư duy",
        "Là thế giới quan và phương pháp luận khoa học, cách mạng của giai cấp công nhân, nhân dân lao động và các lực lượng xã hội tiến bộ trong nhận thức và cải tạo thế giới",
        "Là khoa học nghiên cứu về con người"
      ], answer: [1, 2], multi: true },
      { text: "Thực chất và ý nghĩa cuộc cách mạng trong triết học do C.Mác và Ph.Ăngghen thực hiện là khắc phục: (Chọn 2 đáp án đúng)", options: [
        "Tính chất trực quan, siêu hình của phép biện chứng duy tâm",

        "Kế thừa tư duy nhân loại", "Mở rộng quan điểm duy vật siêu hình"
      ], answer: [0, 1], multi: true },
      { text: "Khẳng định nào sau đây về triết học Mác - Lênin là sai?", options: [
        "Triết học Mác - Lênin có sự thống nhất giữa phương pháp biện chứng và thế giới quan duy vật",
        "Triết học Mác - Lênin là chủ nghĩa duy vật biện chứng",
        "Triết học Mác - Lênin là sự kết hợp phép biện chứng của Hêghen và chủ nghĩa duy vật của Phoi-ơ-bắc",
        "Triết học Mác - Lênin kế thừa và cải tạo Phép biện chứng của Hêghen trên cơ sở duy vật"
      ], answer: [2] },
      { text: "Hình ảnh \"Ông Bụt\" trong các câu truyện cổ tích Việt Nam thể hiện thế giới quan nào trong triết học?", options: [
        "Thế giới quan thần thoại", "Thế giới quan cổ đại",
        "Thế giới quan thần thánh", "Thế giới quan duy tâm"
      ], answer: [0] },
      { text: "Vai trò của triết học Mác - Lênin trong bối cảnh toàn cầu hóa là gì?", options: [

        "Là công cụ đấu tranh chống lại toàn cầu hóa",

      { text: "Triết học Mác - Lênin là cơ sở lý luận khoa học của sự nghiệp đổi mới theo định hướng xã hội chủ nghĩa ở Việt Nam vì: (Chọn 2 đáp án đúng)", options: [

      { text: "Triết học Mác - Lênin có vai trò quan trọng trong việc phân tích các vấn đề xã hội hiện đại vì:", options: [

      { text: "Yếu tố nào là cơ sở để Đảng Cộng sản Việt Nam vận dụng xây dựng cương lĩnh cuộc đổi mới toàn diện xã hội theo định hướng xã hội chủ nghĩa?", options: [
        "Chỉ cần phương pháp luận của triết học Mác - Lênin",

        "Chỉ cần thế giới quan của triết học Mác - Lênin",
        "Kinh nghiệm, cá nhân của lãnh đạo và các mô hình kinh tế phương Tây"
      ], answer: [1] },
      { text: "Kéo thả các nội dung liệt kê dưới đây vào cột tương ứng:", type: "drag",
        items: [
          "Thế giới quan kinh nghiệm",
          "Định hướng cho con người nhận thức",
          "Hệ thống các tri thức, quan điểm, tình cảm, niềm tin, lý tưởng",
          "Bản thân triết học chính là thế giới quan",
          "Thế giới quan tôn giáo",
          "Thế giới quan thông thường",
          "Giúp con người phát triển tư duy khoa học"
        ],
        targets: ["Chức năng thế giới quan là:", "Chức năng phương pháp luận là:"],
        answer: [1, 6]
      },
      { text: "Kéo thả các nội dung liệt kê dưới đây vào các cột tương ứng:", type: "drag",
        items: [

        button.className = "question-link";
        button.textContent = `Câu ${index + 1}`;
        button.setAttribute("aria-label", `Đi đến câu ${index + 1}`);
        button.title = `Câu ${index + 1}${questionStates[index].checked ? " · Đã chấm" : ""}`;
        if (index === current) {
          button.classList.add("current");
          button.setAttribute("aria-current", "step");
        }
        if (questionStates[index].checked) button.classList.add("done");
        button.addEventListener("click", () => {
          saveDraft();
          current = index;
          quizCard.hidden = false;
          summary.style.display = "none";
          setQuestionMenuOpen(false);
          render();
        });
        list.append(button);
      });
      document.querySelector("#questionNav h2").textContent =
        `Tất cả câu hỏi · ${lessons[activeLesson].title}`;
    }

    document.getElementById("lesson1Button").addEventListener("click", () => switchLesson(1));
    document.getElementById("lesson2Button").addEventListener("click", () => switchLesson(2));
    document.getElementById("lesson3Button").addEventListener("click", () => switchLesson(3));
    document.getElementById("lesson4Button").addEventListener("click", () => switchLesson(4));
    document.getElementById("lesson5Button").addEventListener("click", () => switchLesson(5));
    document.getElementById("lesson6Button").addEventListener("click", () => switchLesson(6));
    document.getElementById("lesson7Button").addEventListener("click", () => switchLesson(7));
    document.getElementById("lesson8Button").addEventListener("click", () => switchLesson(8));
    document.getElementById("lesson9Button").addEventListener("click", () => switchLesson(9));
    document.getElementById("menuToggle").addEventListener("click", () => {
      setQuestionMenuOpen(document.getElementById("questionNav").hidden);
    });
    document.getElementById("menuClose").addEventListener("click", () => setQuestionMenuOpen(false));
    document.getElementById("menuBackdrop").addEventListener("click", () => setQuestionMenuOpen(false));
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !document.getElementById("questionNav").hidden) {
        setQuestionMenuOpen(false);
        document.getElementById("menuToggle").focus();
      }
    });

    function saveDraft() {
      const question = questions[current];
      if (question.type === "drag" || question.type === "match") {
        questionStates[current].draft = [...optionsElement.querySelectorAll(".drop-target")].map(target =>
          [...target.querySelectorAll(".drop-answer .drag-chip")].map(chip => Number(chip.dataset.item))
        );
      } else if (question.type === "truth") {
        questionStates[current].draft = question.rows.map((_, index) =>
          optionsElement.querySelector(`input[name="truth-${index}"]:checked`)?.value || ""
        );
      } else {
        questionStates[current].draft = [...optionsElement.querySelectorAll("input:checked")]
          .map(input => Number(input.value));
      }
    }

    function render() {
      const state = questionStates[current];
      checked = state.checked;
      const question = questions[current];
      document.getElementById("questionNumber").textContent = `CÂU ${current + 1}`;
      document.getElementById("questionKind").textContent = question.invalid ? "Cần đối chiếu tài liệu" :
        question.type === "drag" || question.type === "match" ? "Kéo thả vào đáp án đúng" :
        question.type === "truth" ? "Đúng / Sai" :
        question.multi ? `Chọn ${question.answer.length} đáp án đúng` : "Chọn một đáp án";
      document.getElementById("prompt").textContent = question.text;
      document.getElementById("hint").textContent = question.invalid
        ? "Lựa chọn trong tài liệu có vẻ bị lỗi hoặc thiếu nội dung. Câu này vẫn được hiển thị nhưng không tính điểm."
        : question.type === "drag" || question.type === "match" ? "Kéo thẻ đáp án vào hàng phù hợp. Trên điện thoại, chạm một thẻ rồi chạm vào ô đích."
        : question.multi ? `Hãy chọn đúng ${question.answer.length} đáp án rồi kiểm tra.` : "Chọn đáp án phù hợp rồi kiểm tra.";
      optionsElement.replaceChildren();
      feedbackElement.textContent = "";
      feedbackElement.className = "";
      checkButton.disabled = false;
      nextButton.hidden = true;

      if (question.type === "drag" || question.type === "match") {
        const bank = document.createElement("div");
        bank.className = "drag-bank";
        bank.setAttribute("aria-label", "Các đáp án có thể kéo");
        const items = question.type === "drag" ? question.items : question.choices;
        items.forEach((item, itemIndex) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "drag-chip";
          chip.draggable = true;
          chip.dataset.item = itemIndex;
          chip.textContent = item;
          bank.append(chip);
        });
        optionsElement.append(bank);

        const targetAnswers = getTargetAnswers(question);
        const targets = question.type === "drag" ? question.targets : question.rows.map(([label]) => label);
        targets.forEach((target, targetIndex) => {
          const zone = document.createElement("div");
          zone.className = "drop-target";
          zone.dataset.target = targetIndex;
          zone.dataset.capacity = question.type === "drag" ? targetAnswers[targetIndex].length : 1;
          const label = document.createElement("div");
          label.className = "drop-label";
          label.textContent = target;
          const answer = document.createElement("div");
          answer.className = "drop-answer";
          answer.textContent = "Thả nội dung vào đây";
          zone.append(label, answer);
          optionsElement.append(zone);
        });
      } else if (question.type === "truth") {
        question.rows.forEach(([statement], rowIndex) => {
          const row = document.createElement("div");
          row.className = "question";
          const text = document.createElement("p");
          text.textContent = `${rowIndex + 1}. ${statement}`;
          row.append(text);
          question.choices.forEach(choice => {
            const label = document.createElement("label");
            label.className = "option";
            const input = document.createElement("input");
            input.type = "radio";
            input.name = `truth-${rowIndex}`;
            input.value = choice;
            const answerText = document.createElement("span");
            answerText.textContent = choice;
            label.append(input, answerText);
            row.append(label);
          });
          const rowFeedback = document.createElement("p");
          rowFeedback.className = "truth-feedback";
          rowFeedback.dataset.truthFeedback = rowIndex;
          rowFeedback.setAttribute("aria-live", "polite");
          row.append(rowFeedback);
          optionsElement.append(row);
        });
      } else {
        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          const input = document.createElement("input");
          input.type = question.multi ? "checkbox" : "radio";
          input.name = "answer";
          input.value = optionIndex;
          const text = document.createElement("span");
          text.textContent = `${String.fromCharCode(65 + optionIndex)}. ${option}`;
          label.append(input, text);
          optionsElement.append(label);
        });
      }

      if (state.draft) {
        if (question.type === "drag" || question.type === "match") {
          state.draft.forEach((items, targetIndex) => {
            const target = optionsElement.querySelectorAll(".drop-target")[targetIndex];
            const answer = target.querySelector(".drop-answer");
            answer.replaceChildren();
            items.forEach(itemIndex => {
              const chip = optionsElement.querySelector(`.drag-bank .drag-chip[data-item="${itemIndex}"]`);
              if (chip) answer.append(chip);
            });
            refreshDropTarget(target);
          });
        } else if (question.type === "truth") {
          question.rows.forEach((_, index) => {
            const input = optionsElement.querySelector(`input[name="truth-${index}"][value="${state.draft[index]}"]`);
            if (input) input.checked = true;
          });
        } else {
          state.draft.forEach(optionIndex => {
            const input = optionsElement.querySelector(`input[value="${optionIndex}"]`);
            if (input) input.checked = true;
          });
        }
      }

      if (state.checked) {
        if (question.type === "truth") {
          question.rows.forEach((_, rowIndex) => updateTruthFeedback(question, rowIndex));
        } else if (question.answer) {
          revealChoiceFeedback(question);
        }
        feedbackElement.textContent = state.feedback;
        feedbackElement.className = state.correct ? "good" : "bad";
        checkButton.disabled = true;
        nextButton.hidden = true;
        optionsElement.querySelectorAll("input, select, button").forEach(input => input.disabled = true);
      }
      document.getElementById("count").textContent = `${current + 1}/${questions.length}`;
      document.getElementById("progressBar").style.width = `${(current / questions.length) * 100}%`;
      document.querySelector(".progress").setAttribute("aria-valuemax", questions.length);
      document.querySelector(".progress").setAttribute("aria-valuenow", current);
      document.getElementById("menuToggle").setAttribute("aria-label", `Mở danh sách ${questions.length} câu hỏi`);
      document.getElementById("questionNav").setAttribute("aria-label", `Danh sách ${questions.length} câu hỏi`);
      updateAnswerRequirements();
      renderQuestionNav();
    }

    function updateAnswerRequirements() {
      if (checked) {
        checkButton.disabled = true;
        return;
      }
      const question = questions[current];
      let ready = true;

      if (question.type === "truth") {
        ready = question.rows.every((_, rowIndex) =>
          optionsElement.querySelector(`input[name="truth-${rowIndex}"]:checked`)
        );
      } else if (question.type === "drag" || question.type === "match") {
        ready = [...optionsElement.querySelectorAll(".drop-target")].every(target =>
          target.querySelectorAll(".drop-answer .drag-chip").length === Number(target.dataset.capacity)
        );
      } else if (question.multi) {
        ready = optionsElement.querySelectorAll("input:checked").length === question.answer.length;
      } else if (question.answer) {
        ready = optionsElement.querySelectorAll("input:checked").length === 1;
      }

      checkButton.disabled = !ready;
    }

    function revealChoiceFeedback(question) {
      if (!question.answer || question.invalid) return;
      const selected = [...optionsElement.querySelectorAll("input:checked")]
        .map(input => Number(input.value));
      optionsElement.querySelectorAll(".option").forEach(option =>
        option.classList.remove("choice-correct", "choice-incorrect")
      );

      if (selected.length === 0) {
        feedbackElement.textContent = "";
        feedbackElement.className = "";
        return;
      }

      const correctText = question.answer.map(index => ` ${String.fromCharCode(65 + index)}. ${question.options[index]}`).join(";");
      if (question.multi) {
        const correctSet = new Set(question.answer);
        optionsElement.querySelectorAll(".option").forEach((option, index) => {
          const input = option.querySelector("input");
          if (correctSet.has(index)) option.classList.add("choice-correct");
          if (input.checked && !correctSet.has(index)) option.classList.add("choice-incorrect");
        });
        const selectedSet = new Set(selected);
        const isComplete = selected.length === question.answer.length &&
          question.answer.every(index => selectedSet.has(index));
        return;
      }

      const selectedIndex = selected[0];
      const selectedOption = optionsElement.querySelector(`input[value="${selectedIndex}"]`)?.closest(".option");
      const correctIndex = question.answer[0];
      const correctOption = optionsElement.querySelector(`input[value="${correctIndex}"]`)?.closest(".option");
      if (selectedIndex === correctIndex) {
        selectedOption?.classList.add("choice-correct");
      } else {
        selectedOption?.classList.add("choice-incorrect");
        correctOption?.classList.add("choice-correct");
      }
    }

    function updateTruthFeedback(question, rowIndex) {
      const selected = optionsElement.querySelector(`input[name="truth-${rowIndex}"]:checked`);
      const feedback = optionsElement.querySelector(`[data-truth-feedback="${rowIndex}"]`);
      if (!feedback) return;
      feedback.textContent = "";
      feedback.className = "truth-feedback";
      const row = feedback.closest(".question");
      row.querySelectorAll(".option").forEach(option => {
        option.classList.remove("truth-correct", "truth-incorrect");
      });
      const correctAnswer = question.rows[rowIndex][1];
      if (!selected) return;
      row.querySelectorAll(`input[name="truth-${rowIndex}"]`).forEach(input => {
        if (input.value === correctAnswer) input.closest(".option").classList.add("truth-correct");
      });

      const selectedOption = selected.closest(".option");
      if (selected.value === correctAnswer) {
        feedback.textContent = `Bạn chọn “${selected.value}” — chính xác!`;
        feedback.classList.add("good");
      } else {
        selectedOption.classList.add("truth-incorrect");
        feedback.textContent = `Bạn chọn “${selected.value}” — chưa đúng. Đáp án đúng là “${correctAnswer}”.`;
        feedback.classList.add("bad");
      }
    }

    function isCorrect(question) {
      if (question.invalid) return null;
      if (question.type === "drag" || question.type === "match") {
        const targetAnswers = getTargetAnswers(question);
        return [...optionsElement.querySelectorAll(".drop-target")].every((target, index) => {
          const assigned = [...target.querySelectorAll(".drag-chip")]
            .map(chip => Number(chip.dataset.item))
            .sort((a, b) => a - b);
          const expected = [...targetAnswers[index]].sort((a, b) => a - b);
          return assigned.length === expected.length &&
            assigned.every((item, itemIndex) => item === expected[itemIndex]);
        });
      }
      if (question.type === "truth") {
        return question.rows.every(([_, answer], index) =>
          optionsElement.querySelector(`input[name="truth-${index}"]:checked`)?.value === answer
        );
      }
      const selected = [...optionsElement.querySelectorAll("input:checked")]
        .map(input => Number(input.value)).sort((a, b) => a - b);
      const expected = [...question.answer].sort((a, b) => a - b);
      return selected.length === expected.length && selected.every((value, index) => value === expected[index]);
    }

    let selectedDragItem = null;
    function getTargetAnswers(question) {
      if (question.type === "match") {
        return question.rows.map(([, answer]) => [question.choices.indexOf(answer)]);
      }
      return question.targetAnswers || question.answer.map(item => [item]);
    }

    function refreshDropTarget(target) {
      const answer = target.querySelector(".drop-answer");
      const chips = [...answer.querySelectorAll(".drag-chip")];
      target.dataset.items = chips.map(chip => chip.dataset.item).join(",");
      if (chips.length === 0) answer.textContent = "Thả nội dung vào đây";
    }

    function assignDragItem(itemIndex, targetIndex) {
      const question = questions[current];
      if ((question.type !== "drag" && question.type !== "match") || checked || !Number.isInteger(itemIndex)) return;
      const targets = [...optionsElement.querySelectorAll(".drop-target")];
      const bank = optionsElement.querySelector(".drag-bank");
      const target = targets[targetIndex];
      if (!target) return;
      const chip = optionsElement.querySelector(`.drag-chip[data-item="${itemIndex}"]`);
      if (!chip) return;
      const existingTarget = chip.closest(".drop-target");
      if (existingTarget) {
        chip.remove();
        refreshDropTarget(existingTarget);
      }
      const targetChips = target.querySelectorAll(".drop-answer .drag-chip");
      if (targetChips.length >= Number(target.dataset.capacity)) {
        if (question.type !== "match") {
          bank.append(chip);
          return;
        }
        targetChips.forEach(existingChip => bank.append(existingChip));
      }
      const answer = target.querySelector(".drop-answer");
      if (!targetChips.length) answer.replaceChildren();
      answer.append(chip);
      refreshDropTarget(target);
      chip.classList.remove("selected");
      selectedDragItem = null;
      updateAnswerRequirements();
    }

    optionsElement.addEventListener("click", event => {
      const option = event.target.closest(".option");
      if (option && !checked) {
        event.preventDefault();
        const input = option.querySelector("input");
        if (!input || input.disabled) return;
        if (input.type === "radio") {
          optionsElement.querySelectorAll('input[type="radio"]').forEach(item => {
            if (item.name === input.name) item.checked = false;
          });
          input.checked = true;
        } else {
          input.checked = !input.checked;
        }
        input.dispatchEvent(new Event("change", { bubbles: true }));
        return;
      }
      const chip = event.target.closest(".drag-chip");
      const target = event.target.closest(".drop-target");
      if (chip) {
        optionsElement.querySelectorAll(".drag-chip").forEach(item =>
          item.classList.remove("selected")
        );
        selectedDragItem = Number(chip.dataset.item);
        chip.classList.add("selected");
      } else if (target && selectedDragItem !== null) {
        assignDragItem(selectedDragItem, Number(target.dataset.target));
        updateAnswerRequirements();
      }
    });

    optionsElement.addEventListener("change", event => {
      if (checked && event.target.matches('input[type="radio"][name^="truth-"]')) {
        updateTruthFeedback(questions[current], Number(event.target.name.slice("truth-".length)));
      }
      updateAnswerRequirements();
    });

    optionsElement.addEventListener("dragstart", event => {
      const chip = event.target.closest(".drag-chip");
      if (!chip || checked) return;
      event.dataTransfer.setData("text/plain", chip.dataset.item);
      event.dataTransfer.effectAllowed = "move";
    });
    optionsElement.addEventListener("dragover", event => {
      const target = event.target.closest(".drop-target");
      if (!target || checked) return;
      event.preventDefault();
      target.classList.add("over");
    });
    optionsElement.addEventListener("dragleave", event => {
      const target = event.target.closest(".drop-target");
      if (target && !target.contains(event.relatedTarget)) target.classList.remove("over");
    });
    optionsElement.addEventListener("drop", event => {
      const target = event.target.closest(".drop-target");
      if (!target || checked) return;
      event.preventDefault();
      target.classList.remove("over");
      assignDragItem(Number(event.dataTransfer.getData("text/plain")), Number(target.dataset.target));
    });

    checkButton.addEventListener("click", () => {
      if (checked) return;
      updateAnswerRequirements();
      if (checkButton.disabled) {
        const question = questions[current];
        if (question.multi) {
          feedbackElement.textContent = `Hãy chọn đủ ${question.answer.length} đáp án trước khi kiểm tra.`;
        } else if (question.type === "truth") {
          feedbackElement.textContent = "Hãy chọn Đúng hoặc Sai cho tất cả các mệnh đề.";
        } else {
          feedbackElement.textContent = "Hãy hoàn thành đáp án trước khi kiểm tra.";
        }
        feedbackElement.className = "bad";
        return;
      }
      const correct = isCorrect(questions[current]);
      checked = true;
      saveDraft();
      checkButton.disabled = true;
      nextButton.hidden = false;
      const state = questionStates[current];
      state.checked = true;
      state.correct = correct;
      if (correct === null) {
        feedbackElement.textContent = "Câu này chưa tính điểm vì đáp án trong tài liệu chưa rõ.";
        feedbackElement.className = "bad";
        streak = 0;
      } else if (correct) {
        const points = 10 + Math.min(streak, 5) * 2;
        score += points;
        state.points = points;
        streak++;
        feedbackElement.textContent = `Chính xác! +${points} điểm${streak > 1 ? ` · Chuỗi ${streak} câu!` : ""}`;
        feedbackElement.className = "good";
      } else {
        streak = 0;
        feedbackElement.textContent = "Chưa chính xác. Hãy xem lại nội dung bài học rồi thử câu tiếp theo.";
        feedbackElement.className = "bad";
      }
      const question = questions[current];
      if (question.type === "truth") {
        question.rows.forEach((_, rowIndex) => updateTruthFeedback(question, rowIndex));
        const selectedCount = question.rows.filter(([_, answer], rowIndex) =>
          optionsElement.querySelector(`input[name="truth-${rowIndex}"]:checked`)?.value === answer
        ).length;
        feedbackElement.textContent += ` Đáp án đúng: ${selectedCount}/${question.rows.length} mệnh đề chính xác.`;
      } else if (question.answer) {
        revealChoiceFeedback(question);
        const correctLabels = question.answer.map(index =>
          `${String.fromCharCode(65 + index)}. ${question.options[index]}`
        ).join("; ");
        const explanation = question.explanation ? ` ${question.explanation}` : "";
        feedbackElement.textContent += ` Giải thích: đáp án đúng là ${correctLabels}.${explanation}`;
        feedbackElement.className = correct ? "good" : "bad";
      }
      state.feedback = feedbackElement.textContent;
      document.getElementById("score").textContent = score;
      document.getElementById("streak").textContent = streak;
      optionsElement.querySelectorAll("input, select, button").forEach(input => input.disabled = true);
      renderQuestionNav();
    });

    nextButton.addEventListener("click", () => {
      saveDraft();
      if (current < questions.length - 1) {
        current++;
        render();
        return;
      }
      quizCard.hidden = true;
      summary.style.display = "block";
      document.getElementById("progressBar").style.width = "100%";
      document.querySelector(".progress").setAttribute("aria-valuenow", questions.length);
      document.getElementById("summaryText").textContent =
        `Bạn đã hoàn thành ${questions.length} câu và đạt ${score} điểm.`;
      document.getElementById("summaryTitle").textContent =
        score >= questions.length * 10 ? "🏆 Xuất sắc!" : "🎉 Hoàn thành chặng!";
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      current = 0;
      score = 0;
      streak = 0;
      questionStates.forEach(state => {
        state.checked = false;
        state.correct = null;
        state.draft = null;
        state.points = 0;
        state.feedback = "";
      });
      document.getElementById("score").textContent = "0";
      document.getElementById("streak").textContent = "0";
      quizCard.hidden = false;
      summary.style.display = "none";
      render();
    });

    render();
  </script>
</body>
</html>
